max_call_words: 60
rate_limit_seconds: 300
approval_token_ttl_seconds: 600
pin_max_attempts: 3

message_template: >
  {summary} I {actions_done}. Based on past attacks, {next_stage} is likely
  within {window_low} to {window_high} minutes. Press 1 to {option_one}.
  Press 2 to keep watching. Press 3 to call me back in 10 minutes.

inbound_menu:
  - id: status
    label: hear status of open incidents
  - id: isolate
    label: isolate a host from the open incident list
  - id: release
    label: release a host
  - id: block
    label: block the current attacker IP
  - id: remove_decoy
    label: remove a decoy
